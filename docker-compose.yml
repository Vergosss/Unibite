services:
  db:
    image: mongo:8
    env_file: ".env"
    volume:
      - unibite_db: /data/db
    healthcheck:
      test: 
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
  backend:
    build: ./backend/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy    

  frontend:
    build: ./frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy



volumes:
  unibite_db: